<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产品列表 · Givera 嘉雅科技</title>
<style>
* { box-sizing: border-box; }
body { margin:0; padding:40px 20px; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background: radial-gradient(ellipse at bottom, #1b2a4e 0%, #0a0e1a 70%); color:#e8eef7; min-height:100vh; }
.container { max-width: 1000px; margin: 0 auto; }

.top { display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; flex-wrap:wrap; gap:16px; }
h1 { margin:0; font-weight: normal; letter-spacing: 4px; font-size: 26px;
  background: linear-gradient(90deg,#4fc3f7,#7c9cff); -webkit-background-clip:text;
  background-clip:text; color:transparent; }
.back-btn { padding:8px 20px; font-size:14px; letter-spacing:2px; border-radius:30px;
  color:#7c9cff; border:1px solid rgba(80,160,255,0.4); background:transparent;
  text-decoration:none; transition: all 0.3s; }
.back-btn:hover { background: rgba(80,160,255,0.15); border-color:#7c9cff; }

.grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }

.card { background: rgba(20,32,56,0.75); border:1px solid rgba(80,160,255,0.2);
  border-radius: 18px; overflow:hidden; text-decoration:none; color:inherit;
  display:block; transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s; }
.card:hover { transform: translateY(-5px); border-color: rgba(80,160,255,0.6);
  box-shadow: 0 10px 40px rgba(80,160,255,0.2); }

.thumb { width:100%; height:180px; object-fit:cover; background:#111a2e; display:block; }
.thumb.placeholder { display:flex; align-items:center; justify-content:center;
  color:#4a5878; font-size: 40px; }

.body { padding: 20px; }
.name { font-size: 17px; color:#e8eef7; margin: 0 0 8px; font-weight: 500; }
.desc { font-size: 13px; color:#b8c6dc; line-height: 1.7; margin: 0;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; }
.arrow { margin-top: 12px; font-size: 13px; color:#4fc3f7; letter-spacing: 1px; }

.empty { text-align:center; padding:80px 20px; color:#7a8ba8; grid-column: 1 / -1; }
.empty a { color:#4fc3f7; text-decoration:none; }
</style>
</head>
<body>
  <div class="container">
    <div class="top">
      <h1>产品中心</h1>
      <a class="back-btn" href="/">← 返回首页</a>
    </div>
    <div class="grid" id="grid">
      <div class="empty">加载中…</div>
    </div>
  </div>

<script>
function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

(async () => {
  const grid = document.getElementById("grid");
  try {
    const res = await fetch("/api/items?t=" + Date.now(), { cache: "no-store" });
    const data = await res.json();
    const items = data.items || [];

    if (!items.length) {
      grid.innerHTML = '<div class="empty">暂无产品</div>';
      return;
    }

    grid.innerHTML = items.map(it => `
      <a class="card" href="/product?id=${it.id}">
        ${it.image_url
          ? `<img class="thumb" src="${escapeHtml(it.image_url)}" alt=""
               onerror="this.outerHTML='<div class=\\'thumb placeholder\\'>📦</div>'">`
          : '<div class="thumb placeholder">📦</div>'}
        <div class="body">
          <h3 class="name">${escapeHtml(it.name)}</h3>
          <p class="desc">${escapeHtml(it.description || "")}</p>
          <div class="arrow">查看详情 →</div>
        </div>
      </a>
    `).join("");
  } catch (e) {
    grid.innerHTML = '<div class="empty">加载失败，请刷新重试</div>';
  }
})();
</script>
</body>
</html>

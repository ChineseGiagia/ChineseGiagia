<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>固件管理 · Givera</title>
<style>
* { box-sizing: border-box; }
body { margin:0; padding:30px 20px; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background: radial-gradient(ellipse at bottom, #1b2a4e 0%, #0a0e1a 70%); color:#e8eef7; min-height:100vh; }
.wrap { max-width: 1100px; margin: 0 auto; }
header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:24px; flex-wrap:wrap; }
h1 { font-weight: normal; letter-spacing: 3px; font-size: 22px; color:#4fc3f7; margin:0; }
.toolbar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.btn { padding:10px 20px; border-radius:30px; border:none; cursor:pointer; font-size:14px;
  letter-spacing:1px; transition: transform 0.15s; font-family:inherit; text-decoration:none; display:inline-block; }
.btn:hover { transform: scale(1.03); }
.btn-primary { background: linear-gradient(135deg,#4fc3f7,#7c9cff); color:#0a0e1a; font-weight:bold; }
.btn-ghost { background: transparent; color:#7c9cff; border:1px solid rgba(80,160,255,0.4); }
.card { background: rgba(20,32,56,0.75); border:1px solid rgba(80,160,255,0.2);
  border-radius: 16px; padding: 8px; overflow:hidden; }
table { width:100%; border-collapse: collapse; }
th, td { padding:14px 16px; text-align:left; font-size:14px; vertical-align:middle; }
th { color:#7a8ba8; font-weight:normal; font-size:13px; letter-spacing:1px; border-bottom:1px solid rgba(80,160,255,0.15); }
td { border-bottom:1px solid rgba(80,160,255,0.08); }
tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: rgba(80,160,255,0.05); }
.empty { text-align:center; padding:40px; color:#7a8ba8; font-size:14px; }
.mini { padding:6px 14px; font-size:13px; border-radius:20px; border:none; cursor:pointer; font-family:inherit; }
.mini-del { background: rgba(255,80,80,0.1); color:#ff8f8f; border:1px solid rgba(255,80,80,0.3); }
.mini-del:hover { background: rgba(255,80,80,0.25); }
.modal-mask { position: fixed; inset:0; background: rgba(0,0,0,0.7); display:none;
  align-items:center; justify-content:center; z-index:100; padding: 20px; }
.modal-mask.show { display:flex; }
.modal { background: #131c30; border:1px solid rgba(80,160,255,0.3); border-radius:18px;
  width:100%; max-width:520px; padding:28px; max-height: 90vh; overflow-y: auto; }
.modal h3 { margin:0 0 20px; font-weight:normal; color:#4fc3f7; letter-spacing:2px; font-size:18px; }
.field { margin-bottom:16px; }
.field label { display:block; font-size:13px; color:#7a8ba8; margin-bottom:6px; letter-spacing:1px; }
.field input, .field select, .field textarea { width:100%; padding:11px 14px; font-family:inherit; font-size:14px;
  background: rgba(10,14,26,0.8); border:1px solid rgba(80,160,255,0.25);
  border-radius:10px; color:#e8eef7; outline:none; }
.field input:focus, .field select:focus, .field textarea:focus { border-color:#4fc3f7; }
.field textarea { min-height: 80px; resize: vertical; }
.upload-btn { display:inline-block; padding:10px 18px; font-size:13px; border-radius:10px;
  border:1px dashed rgba(80,160,255,0.5); background: rgba(80,160,255,0.08);
  color:#7c9cff; cursor:pointer; font-family:inherit; width:100%; text-align:center; }
.upload-btn:hover { background: rgba(80,160,255,0.2); }
.upload-btn:disabled { opacity:0.5; cursor:not-allowed; }
.file-info { font-size:12px; color:#8affa8; margin-top:8px; min-height:16px; }
.modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:22px; }
.msg { font-size:13px; margin-top:12px; min-height:18px; text-align:right; }
.spinner { display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,0.3);
  border-top-color:#7c9cff; border-radius:50%; animation: spin 0.8s linear infinite; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>固件管理</h1>
      <div class="toolbar">
        <a class="btn btn-ghost" href="/admin/">← 产品管理</a>
        <a class="btn btn-ghost" href="/admin/personal">私人数据</a>
        <button class="btn btn-primary" id="addBtn">+ 添加固件</button>
        <button class="btn btn-ghost" id="logout">退出</button>
      </div>
    </header>
    <div class="card">
      <table>
        <thead>
          <tr>
            <th style="width:30%">所属产品</th>
            <th style="width:15%">版本</th>
            <th>说明</th>
            <th style="width:18%">文件名</th>
            <th style="width:100px">大小</th>
            <th style="width:90px">操作</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="6" class="empty">加载中…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="modal-mask" id="modal">
    <div class="modal">
      <h3>添加固件</h3>
      <div class="field">
        <label>所属产品</label>
        <select id="product"></select>
      </div>
      <div class="field">
        <label>版本号（如 v1.0.0）</label>
        <input id="version" placeholder="v1.0.0">
      </div>
      <div class="field">
        <label>说明</label>
        <textarea id="desc" placeholder="本次更新内容"></textarea>
      </div>
      <div class="field">
        <label>固件文件（.zip，不超过 20MB）</label>
        <button type="button" class="upload-btn" id="fileBtn">📦 选择 zip 文件</button>
        <input type="file" id="fileInput" accept=".zip,.bin,.hex" style="display:none">
        <div class="file-info" id="fileInfo"></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="cancelBtn">取消</button>
        <button class="btn btn-primary" id="saveBtn">上传并保存</button>
      </div>
      <div class="msg" id="modalMsg"></div>
    </div>
  </div>

<script>
var tbody = document.getElementById("tbody");
var modal = document.getElementById("modal");
var productEl = document.getElementById("product");
var versionEl = document.getElementById("version");
var descEl = document.getElementById("desc");
var fileInput = document.getElementById("fileInput");
var fileBtn = document.getElementById("fileBtn");
var fileInfo = document.getElementById("fileInfo");
var modalMsg = document.getElementById("modalMsg");

var allItems = [];
var allFirmwares = [];
var pickedFile = null;

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c) {
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}

function formatSize(bytes) {
  if (!bytes) return "";
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / 1024 / 1024).toFixed(2) + " MB";
}

async function loadAll() {
  try {
    var itemsRes = await fetch("/api/items?t=" + Date.now(), { cache: "no-store", credentials: "include" });
    if (itemsRes.status === 401) { location.href = "/login"; return; }
    var itemsData = await itemsRes.json();
    allItems = itemsData.items || [];

    var fwRes = await fetch("/api/firmwares-all?t=" + Date.now(), { cache: "no-store", credentials: "include" });
    if (fwRes.ok) {
      var fwData = await fwRes.json();
      allFirmwares = fwData.firmwares || [];
    } else {
      allFirmwares = [];
    }
    render();
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">加载失败：' + e.message + '</td></tr>';
  }
}

function render() {
  if (!allFirmwares.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">还没有固件，点右上角「添加固件」</td></tr>';
    return;
  }
  var productMap = {};
  allItems.forEach(function(it) { productMap[it.id] = it.name; });
  tbody.innerHTML = allFirmwares.map(function(f) {
    return '<tr>' +
      '<td>' + escapeHtml(productMap[f.product_id] || ("#" + f.product_id)) + '</td>' +
      '<td style="color:#4fc3f7;">' + escapeHtml(f.version) + '</td>' +
      '<td style="color:#b8c6dc;">' + escapeHtml(f.description || "") + '</td>' +
      '<td style="font-size:12px; color:#7a8ba8;">' + escapeHtml(f.file_name) + '</td>' +
      '<td style="font-size:12px; color:#7a8ba8;">' + formatSize(f.file_size) + '</td>' +
      '<td><button class="mini mini-del" data-del="' + f.id + '">删除</button></td>' +
      '</tr>';
  }).join("");
}

function openModal() {
  modalMsg.textContent = "";
  versionEl.value = "";
  descEl.value = "";
  pickedFile = null;
  fileInfo.textContent = "";
  fileInput.value = "";
  productEl.innerHTML = allItems.map(function(it) {
    return '<option value="' + it.id + '">' + escapeHtml(it.name) + '</option>';
  }).join("");
  if (!allItems.length) {
    productEl.innerHTML = '<option value="">（请先添加产品）</option>';
  }
  modal.classList.add("show");
}

function closeModal() { modal.classList.remove("show"); }

fileBtn.onclick = function() { fileInput.click(); };

fileInput.addEventListener("change", function() {
  var f = fileInput.files[0];
  if (!f) return;
  pickedFile = f;
  fileInfo.textContent = "已选择：" + f.name + "（" + formatSize(f.size) + "）";
});

function fileToBase64(file) {
  return new Promise(function(res, rej) {
    var r = new FileReader();
    r.onload = function() {
      var s = r.result;
      res(s.split(",")[1] || "");
    };
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

tbody.addEventListener("click", async function(e) {
  var id = e.target.dataset.del;
  if (!id) return;
  if (!confirm("确定删除这条固件吗？会同时删除 GitHub 上的文件。")) return;
  var res = await fetch("/api/firmwares/" + id, { method: "DELETE", credentials: "include" });
  var d = await res.json();
  if (d.success) {
    if (d.gh_error) {
      alert("数据库记录已删除，但 GitHub 文件删除失败：" + d.gh_error);
    }
    loadAll();
  } else {
    alert(d.error || "删除失败");
  }
});

document.getElementById("addBtn").onclick = openModal;
document.getElementById("cancelBtn").onclick = closeModal;
modal.addEventListener("click", function(e) { if (e.target === modal) closeModal(); });

document.getElementById("saveBtn").onclick = async function() {
  var productId = productEl.value;
  var version = versionEl.value.trim();
  var description = descEl.value;

  if (!productId) { modalMsg.style.color="#ff8f8f"; modalMsg.textContent="请选择产品"; return; }
  if (!version) { modalMsg.style.color="#ff8f8f"; modalMsg.textContent="请填写版本号"; return; }
  if (!pickedFile) { modalMsg.style.color="#ff8f8f"; modalMsg.textContent="请选择固件文件"; return; }

  var saveBtn = document.getElementById("saveBtn");
  saveBtn.disabled = true;
  var orig = saveBtn.textContent;
  saveBtn.innerHTML = '<span class="spinner"></span>上传中…';
  modalMsg.textContent = "";

  try {
    var base64 = await fileToBase64(pickedFile);
    modalMsg.style.color = "#7a8ba8";
    modalMsg.textContent = "上传文件到 GitHub…";
    var upRes = await fetch("/api/upload-firmware", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ name: pickedFile.name, data: base64 })
    });
    var upD = await upRes.json();
    if (!upD.success) throw new Error(upD.error || "文件上传失败");

    modalMsg.textContent = "写入数据库…";
    var dbRes = await fetch("/api/firmwares", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({
        product_id: productId,
        version: version,
        description: description,
        file_name: upD.file_name,
        file_size: upD.file_size
      })
    });
    var dbD = await dbRes.json();
    if (!dbD.success) throw new Error(dbD.error || "保存失败");

    modalMsg.style.color = "#8affa8";
    modalMsg.textContent = "✓ 上传成功！约 1-2 分钟后可在产品页下载";
    setTimeout(function() { closeModal(); loadAll(); }, 1200);
  } catch (e) {
    modalMsg.style.color = "#ff8f8f";
    modalMsg.textContent = "✗ " + e.message;
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = orig;
  }
};

document.getElementById("logout").onclick = async function() {
  await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
  location.href = "/login";
};

loadAll();
</script>
</body>
</html>
